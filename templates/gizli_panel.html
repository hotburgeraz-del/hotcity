<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Gizli Admin Panel - Hot City</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        h1 {
            color: #f39c12;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #1e1e1e;
        }
        th, td {
            padding: 10px;
            border: 1px solid #333;
            text-align: left;
            font-size: 13px;
        }
        th {
            background-color: #2c3e50;
        }
        input[type="number"] {
            padding: 5px;
            width: 80px;
            background: #222;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
        }
        button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
        }
        button:hover {
            background: #219653;
        }
        .msg {
            margin-top: 15px;
            font-size: 16px;
            color: #2ecc71;
            text-align: center;
            font-weight: bold;
        }
        .status-online { color: #2ecc71; font-weight: bold; }
        .status-offline { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Gizli Admin İdarəetmə Paneli</h1>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Ad</th>
                <th>Email</th>
                <th>Balans</th>
                <th>Ümumi Depozit</th>
                <th>Status</th>
                <th>Balansı Artır</th>
            </tr>
        </thead>
        <tbody id="playerTableBody">
            {% for player in players %}
            <tr id="row_{{ player.id }}">
                <td>{{ player.id }}</td>
                <td>{{ player.name }}</td>
                <td>{{ player.email }}</td>
                <td id="bal_{{ player.id }}">{{ "%.2f"|format(player.balance) }} ₼</td>
                <td>{{ "%.2f"|format(player.total_deposit) }} ₼</td>
                <td id="status_{{ player.id }}" class="{% if 'Onlayn' in player.status %}status-online{% else %}status-offline{% endif %}">{{ player.status }}</td>
                <td>
                    <input type="number" step="0.01" id="add_bal_{{ player.id }}" placeholder="Artır">
                    <button onclick="addBalance('{{ player.id }}')">Artır</button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <div id="message" class="msg"></div>

    <script>
        function showMessage(text) {
            const msgDiv = document.getElementById('message');
            msgDiv.innerText = text;
            setTimeout(() => { msgDiv.innerText = ''; }, 3000);
        }

        function addBalance(playerId) {
            const amount = document.getElementById('add_bal_' + playerId).value;
            if(!amount) return;
            fetch('/api/add_balance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ player_id: playerId, amount: amount })
            })
            .then(res => res.json())
            .then(data => {
                showMessage(data.message);
                if(data.success) {
                    setTimeout(() => location.reload(), 1000);
                }
            })
            .catch(err => console.error('Xəta:', err));
        }

        // Statusu hər saniyə real vaxtda yenilə
        setInterval(() => {
            fetch('/api/get_players')
            .then(res => res.json())
            .then(players => {
                players.forEach(p => {
                    let statusTd = document.getElementById(`status_${p.id}`);
                    let balTd = document.getElementById(`bal_${p.id}`);
                    if(statusTd) {
                        statusTd.innerText = p.status;
                        statusTd.className = p.status.includes('Onlayn') ? 'status-online' : 'status-offline';
                    }
                    if(balTd) {
                        balTd.innerText = parseFloat(p.balance).toFixed(2) + ' ₼';
                    }
                });
            });
        }, 1000);
    </script>

</body>
</html>
