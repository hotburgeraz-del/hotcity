<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Gizli Admin Panel - Hot City</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        h1 {
            color: #f39c12;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #1e1e1e;
        }
        th, td {
            padding: 12px;
            border: 1px solid #333;
            text-align: left;
        }
        th {
            background-color: #2c3e50;
        }
        input[type="number"] {
            padding: 6px;
            width: 90px;
            background: #222;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
        }
        button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 14px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
        button:hover {
            background: #c0392b;
        }
        .msg {
            margin-top: 15px;
            font-size: 16px;
            color: #2ecc71;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Gizli Admin İdarəetmə Paneli</h1>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Ad</th>
                <th>Email</th>
                <th>Balans</th>
                <th>Status</th>
                <th>Növbəti Qazanc (Next Win)</th>
                <th>Əməliyyat</th>
            </tr>
        </thead>
        <tbody>
            {% for player in players %}
            <tr>
                <td>{{ player.id }}</td>
                <td>{{ player.name }}</td>
                <td>{{ player.email }}</td>
                <td>{{ player.balance }} ₼</td>
                <td>{{ player.status }}</td>
                <td>
                    <input type="number" step="0.01" id="win_{{ player.id }}" value="{{ player.next_win if player.next_win is not none else '' }}" placeholder="Boş / Məbləğ">
                </td>
                <td>
                    <button onclick="setWin('{{ player.id }}')">Təyin et</button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <div id="message" class="msg"></div>

    <script>
        function setWin(playerId) {
            const val = document.getElementById('win_' + playerId).value;
            fetch('/api/set_next_win', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ player_id: playerId, next_win: val })
            })
            .then(res => res.json())
            .then(data => {
                const msgDiv = document.getElementById('message');
                msgDiv.innerText = data.message;
                setTimeout(() => { msgDiv.innerText = ''; }, 3000);
            })
            .catch(err => {
                console.error('Xəta:', err);
            });
        }
    </script>

</body>
</html>
