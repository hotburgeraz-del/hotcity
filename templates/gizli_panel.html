<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOT CITY - Admin Control Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #05020a; color: #fff; padding: 20px; }
        h2 { color: #ffcc00; margin-bottom: 15px; }
        .table-container { background: #1a0000; border: 2px solid #ff3300; border-radius: 8px; padding: 15px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; text-align: left; }
        th, td { border: 1px solid #440000; padding: 10px; color: #ddd; }
        th { background: #330000; color: #ffcc00; }
        .refresh-btn { background: #ff3300; color: #fff; border: none; padding: 8px 16px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-bottom: 15px; }
        .refresh-btn:hover { background: #ff5522; }
        .action-row { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
        .status-dot { height: 12px; width: 12px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .online { background-color: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
        .offline { background-color: #e74c3c; box-shadow: 0 0 8px #e74c3c; }
        .balance-btn { background: #27ae60; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 5px; }
        .balance-btn.minus { background: #c0392b; }
        .balance-btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <h2>HOT CITY - Canlı Oyunçu və İdarəetmə Paneli</h2>
    
    <div class="action-row">
        <button class="refresh-btn" onclick="loadAdminData()" style="margin-bottom:0;">Siyahını Yenilə</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Oyunçu ID</th>
                    <th>Qeydiyyat Kodu (Şifrə)</th>
                    <th>Aktivlik / Vaxt</th>
                    <th>Cari Balans</th>
                    <th>Balansı Dəyiş (+10 / -10 ₼)</th>
                </tr>
            </thead>
            <tbody id="adminPlayersList">
                <!-- Oyunçular bura avtomatik yüklənəcək -->
            </tbody>
        </table>
    </div>

    <script>
        async function loadAdminData() {
            let tbody = document.getElementById('adminPlayersList');
            try {
                let response = await fetch('/get_data');
                let allPlayers = await response.json();
                tbody.innerHTML = '';

                let keys = Object.keys(allPlayers);
                if (keys.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#888;">Hələ heç bir oyunçu qeydiyyatdan keçməyib.</td></tr>`;
                    return;
                }

                let now = Date.now();

                keys.forEach(id => {
                    let p = allPlayers[id];
                    let lastSeen = p.last_active || 0;
                    let isOnline = (now - lastSeen) < 6000; // Son 6 saniyədə hərəkət edibsə onlayn sayılır
                    
                    let statusClass = isOnline ? 'online' : 'offline';
                    let statusText = isOnline ? 'Onlayn (Aktiv)' : 'Oflayn';
                    let timeStr = lastSeen ? new Date(lastSeen).toLocaleTimeString() : 'Naməlum';

                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><b>${id}</b></td>
                        <td style="color:#ffcc00; font-weight:bold; letter-spacing:1px;">${p.code || ''}</td>
                        <td>
                            <span class="status-dot ${statusClass}"></span>
                            <b>${statusText}</b> <br><small style="color:#aaa;">Son görünmə: ${timeStr}</small>
                        </td>
                        <td>₼${(parseFloat(p.balance) || 0).toFixed(2)}</td>
                        <td>
                            <button class="balance-btn" onclick="updateBalance('${id}', 10)">+10 ₼</button>
                            <button class="balance-btn minus" onclick="updateBalance('${id}', -10)">-10 ₼</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Məlumatı çəkmək mümkün olmadı:", err);
            }
        }

        async function updateBalance(playerId, amount) {
            try {
                let response = await fetch('/get_data');
                let allPlayers = await response.json();
                
                if (allPlayers[playerId]) {
                    let currentBal = parseFloat(allPlayers[playerId].balance) || 0;
                    let newBal = currentBal + amount;
                    if (newBal < 0) newBal = 0; // Balans mənfi ola bilməz
                    allPlayers[playerId].balance = newBal;

                    await fetch('/save_data', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(allPlayers)
                    });

                    loadAdminData();
                }
            } catch (err) {
                console.error("Balansı yeniləmək mümkün olmadı:", err);
            }
        }

        // Hər 2 saniyədən bir avtomatik yenilə
        window.onload = loadAdminData;
        setInterval(loadAdminData, 2000);
    </script>
</body>
</html>
